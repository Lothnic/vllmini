name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up UV
              uses: astral-sh/setup-uv@v6
              with:
                enable-cache: true

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: Install dependencies
              run: uv sync

            - name: Run tests
              run: uv run pytest -q

            - name: Smoke imports
              run: uv run python -c "import engine.sampler; import models.weight_loader; print('ok')"